name: Evening analysis

on:
  schedule:
    # 15:00 UTC = 5 pm Cairo / 7 pm UAE, Sunday to Friday (after EGX and UAE markets close)
    - cron: "0 15 * * 0-5"
  workflow_dispatch: {}   # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: evening-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install
        run: pip install -r engine/requirements.txt

      - name: Download prices, score stocks, send email alerts
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          ALERT_EMAILS: ${{ secrets.ALERT_EMAILS }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python engine/analyze.py

      - name: Save today's results to the website
        run: |
          git config user.name "stock-advisor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "Nothing changed" && exit 0
          git commit -m "Evening update $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
